# Hetzner installimage config — OnSocial testnet node box (HEL1)
# Ryzen 7 3700X, 2x1TB NVMe, 64GB ECC.
#
# Usage (in the rescue system, as root):
#   1. scp this file to the rescue box: scp installimage.conf root@<IP>:/root/
#   2. Verify the image name exists:       ls /root/.oldroot/nfs/images/ | grep -i debian
#      (adjust IMAGE below to the newest Debian 12 bookworm listed)
#   3. Run:                                installimage -a -c installimage.conf
#   4. reboot
#
# Layout: both NVMes in SW RAID1 — OS + near hot + PG + docker all on the
# mirror. There is no separate cold disk on this box (auction shape), so the
# node keeps the default GC window; deep history lives as S3 archives instead.

DRIVE1 /dev/nvme0n1
DRIVE2 /dev/nvme1n1

SWRAID 1
SWRAIDLEVEL 1
BOOTLOADER grub

HOSTNAME onsocial-node1

# Sizes in bare MiB (this rescue build's translate_unit leaves suffixed
# values untouched and the parser then crashes on them).
PART swap swap 4096
PART /boot ext4 1024
PART /     ext4 all

# Verified present on the rescue image index (2026-10-19). Use the concrete
# file, not the *-latest symlink.
IMAGE /root/.oldroot/nfs/images/Debian-1215-bookworm-amd64-base.tar.zst

# installimage copies these into the installed system. The rescue system
# already holds our pubkey (Hetzner put it there from the order), so reuse it.
SSHKEYS_URL /root/.ssh/authorized_keys

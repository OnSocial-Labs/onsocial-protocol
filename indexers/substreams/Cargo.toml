[package]
name = "onsocial-substreams"
version = "0.9.1"
edition = "2024"
rust-version = "1.93"
description = "Substreams indexer for OnSocial protocol"

[lib]
# `cdylib` keeps the wasm .spkg build; `rlib` links the same decoders into
# native binaries (neardata_reader). Both share one source of truth.
crate-type = ["cdylib", "rlib"]

[dependencies]
substreams = "0.7.3"
substreams-near = "0.10.2"
substreams-database-change = "3.0.0"
prost = "0.13"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
bs58 = "0.5.1"

# Native-only deps. Target-gated so the wasm .spkg build never compiles them
# — tokio/reqwest/tokio-postgres do not build for wasm32-unknown-unknown.
#
# The lib's shared writer/pipeline need only tokio-postgres/anyhow/tracing.
# reqwest+tokio+clap+tracing-subscriber are the reader BIN's own deps and sit
# behind the `native` feature: the node-indexer links this crate's lib.
# reqwest uses native-tls (openssl), NOT rustls: cargo resolves the union of
# all optional deps into Cargo.lock, and rustls' aws-lc-rs requirement
# conflicts with near-crypto's exact `=1.16.2` aws-lc-rs pin in the nearcore
# graph — keeping rustls out of the lock entirely is the only clean fix.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
anyhow = "1"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[build-dependencies]
prost-build = "0.13"

[features]
# Opt-in: `cargo build --bin neardata_reader --features native`. Keeping it
# out of the default features means `cargo build --target wasm32-unknown-unknown`
# (all targets, as CI and pack.sh run it) silently skips the native-only bin
# instead of failing on tokio/reqwest, which do not compile for wasm.
native = ["reqwest", "tokio", "clap", "tracing-subscriber"]

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "neardata_reader"
path = "src/bin/neardata_reader.rs"
required-features = ["native"]

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
